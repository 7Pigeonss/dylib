name: Build iOS dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS tweak dylib
        run: |
          mkdir -p build
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios15.0 \
            -isysroot "$SDK_PATH" \
            -fobjc-arc \
            -dynamiclib \
            -Wl,-install_name,@rpath/libCenterDot.dylib \
            -Wl,-no_fixup_chains \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            CenterDotTweak.m \
            -o build/libCenterDot.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: CenterDot-iOS-arm64
          path: build/libCenterDot.dylib