name: Build iOS dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS dylib
        run: |
          mkdir -p build
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios26.5 \
            -sdk "$SDK_PATH" \
            -emit-library \
            -emit-module \
            -module-name CenterDot \
            -emit-module-path build/CenterDot.swiftmodule \
            CenterDotView.swift \
            -o build/libCenterDot.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: CenterDot-iOS-arm64
          path: |
            build/libCenterDot.dylib
            build/CenterDot.swiftmodule